# Required for ament_python: without this, setuptools installs console_scripts
# to install/<pkg>/bin/ while `ros2 run` looks in install/<pkg>/lib/<pkg>/,
# so the executables build fine but are invisible to ros2 run / ros2 launch.
[develop]
script_dir=$base/lib/fcos3d_ros2
[install]
install_scripts=$base/lib/fcos3d_ros2
